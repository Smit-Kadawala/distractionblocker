<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Blocked - Focus Lock</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #12141a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 420px; padding: 20px; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { color: #9aa0ab; font-size: 14px; line-height: 1.5; }
    .site { color: #ff8b8b; font-weight: 600; }
    .lock { font-size: 44px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">&#128274;</div>
    <h1>Time's up for today</h1>
    <p>You hit your daily limit for <span class="site" id="siteName"></span>.<br />
    It's locked until midnight. This can't be overridden from here.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
